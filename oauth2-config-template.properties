# ========================================
# OAuth2 Configuration for Social Login
# ========================================
# Add these settings to your application.properties file

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=228462176602-tedpftmf97bgvdkqtg99qa5qtd4a6sbv.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Frontend URL for OAuth redirect
app.frontend.url=http://localhost:5173

# ========================================
# Environment Variables to Set
# ========================================
# You can set these in your OS or in .env file:
#
# Windows PowerShell:
#   $env:GOOGLE_CLIENT_ID="your-google-client-id"
#   $env:GOOGLE_CLIENT_SECRET="your-google-client-secret"
#   $env:GITHUB_CLIENT_ID="your-github-client-id"
#   $env:GITHUB_CLIENT_SECRET="your-github-client-secret"
#   $env:FACEBOOK_CLIENT_ID="your-facebook-app-id"
#   $env:FACEBOOK_CLIENT_SECRET="your-facebook-app-secret"
#
# Or directly in application.properties (NOT recommended for production):
#   spring.security.oauth2.client.registration.google.client-id=actual-value-here
#   spring.security.oauth2.client.registration.google.client-secret=actual-value-here

# ========================================
# Production Changes
# ========================================
# For production, change:
#   app.frontend.url=https://your-domain.com
#
# And update OAuth redirect URIs in provider consoles to:
#   https://your-domain.com/login/oauth2/code/google
#   https://your-domain.com/login/oauth2/code/github
#   https://your-domain.com/login/oauth2/code/facebook
